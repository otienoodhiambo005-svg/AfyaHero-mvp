apiVersion: v1
kind: ServiceAccount
metadata:
  name: afyahero
  namespace: afyahero
  labels:
    app: afyahero

---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: afyahero-role
  namespace: afyahero
  labels:
    app: afyahero
rules:
  # Read pods for service discovery
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
  
  # Read configmaps for configuration
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "list", "watch"]
  
  # Read secrets for application secrets
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: afyahero-rolebinding
  namespace: afyahero
  labels:
    app: afyahero
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: afyahero-role
subjects:
  - kind: ServiceAccount
    name: afyahero
    namespace: afyahero

---
# ClusterRole for reading cluster-wide resources (if needed)
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: afyahero-cluster-role
  labels:
    app: afyahero
rules:
  # Read cluster information
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["get", "list", "watch"]
  
  # Read aggregate metrics
  - apiGroups: ["metrics.k8s.io"]
    resources: ["pods", "nodes"]
    verbs: ["get", "list"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: afyahero-cluster-rolebinding
  labels:
    app: afyahero
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: afyahero-cluster-role
subjects:
  - kind: ServiceAccount
    name: afyahero
    namespace: afyahero
