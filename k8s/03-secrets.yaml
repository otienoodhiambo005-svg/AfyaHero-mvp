apiVersion: v1
kind: Secret
metadata:
  name: afyahero-secrets
  namespace: afyahero
  labels:
    app: afyahero
    component: secrets
type: Opaque
stringData:
  # Database credentials (PostgreSQL)
  DATABASE_URL: "postgresql+asyncpg://afyahero:CHANGE_ME@db:5432/afyahero"
  DB_PASSWORD: "CHANGE_ME"
  
  # Supabase
  SUPABASE_URL: "https://xxxxx.supabase.co"
  SUPABASE_KEY: "CHANGE_ME"
  SUPABASE_SERVICE_ROLE_KEY: "CHANGE_ME"
  
  # Redis
  REDIS_URL: "redis://redis:6379"
  UPSTASH_REDIS_REST_URL: "https://xxxxx.upstash.io"
  UPSTASH_REDIS_REST_TOKEN: "CHANGE_ME"
  
  # JWT/Session secrets
  JWT_SECRET: "CHANGE_ME_GENERATE_RANDOM_STRING"
  SESSION_SECRET: "CHANGE_ME_GENERATE_RANDOM_STRING"
  
  # AI Provider Keys (at least one required)
  # GEMINI_API_KEY: "CHANGE_ME"
  # OPENAI_API_KEY: "CHANGE_ME"
  # ANTHROPIC_API_KEY: "CHANGE_ME"
  # GROQ_API_KEY: "CHANGE_ME"
  # HF_API_KEY: "CHANGE_ME"
  
  # OAuth (if using)
  # GITHUB_ID: "CHANGE_ME"
  # GITHUB_SECRET: "CHANGE_ME"
  
  # Email (ZeptoMail)
  # EMAIL_SMTP_HOST: "smtp.zeptomail.com"
  # EMAIL_SMTP_PORT: "465"
  # EMAIL_SMTP_USER: "emailapikey"
  # EMAIL_SMTP_PASS: "CHANGE_ME"
  # EMAIL_FROM: "noreply@afyahero.com"
  
  # AfyaLink (Kenya SHA)
  # AFYALINK_ENVIRONMENT: "UAT"
  # AFYALINK_BASE_URL: "https://uat.dha.go.ke"
  # AFYALINK_AGENT_ID: "CHANGE_ME"
  # AFYALINK_BASIC_USERNAME: "CHANGE_ME"
  # AFYALINK_BASIC_PASSWORD: "CHANGE_ME"
  
  # Monitoring
  # SENTRY_DSN: "CHANGE_ME"
  
  # Encryption
  ENCRYPTION_KEY: "CHANGE_ME_GENERATE_RANDOM_STRING"

---
# Create secrets from env file:
# kubectl create secret generic afyahero-secrets --from-env-file=.env.k8s -n afyahero
