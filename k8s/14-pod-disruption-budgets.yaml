apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: gateway-pdb
  namespace: afyahero
  labels:
    app: afyahero
    component: gateway
spec:
  minAvailable: 1
  maxUnavailable: 0
  selector:
    matchLabels:
      app: afyahero
      component: gateway
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: web-pdb
  namespace: afyahero
  labels:
    app: afyahero
    component: web
spec:
