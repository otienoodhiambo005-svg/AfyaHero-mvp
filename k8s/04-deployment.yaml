apiVersion: apps/v1
kind: Deployment
metadata:
  name: afyahero-superadmin
  namespace: afyahero
  labels:
    app: afyahero
    component: superadmin
    version: v1
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: afyahero
      component: superadmin
  template:
    metadata:
      labels:
        app: afyahero
        component: superadmin
        version: v1
    spec:
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchExpressions:
                    - key: app
                      operator: In
                      values:
                        - afyahero
                topologyKey: kubernetes.io/hostname

      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        fsGroup: 1001

      serviceAccountName: afyahero

      terminationGracePeriodSeconds: 30

      containers:
        - name: superadmin
          image: afyahero.azurecr.io/web:latest
          imagePullPolicy: IfNotPresent

          ports:
            - name: http
              containerPort: 3000
              protocol: TCP

          envFrom:
            - configMapRef:
                name: afyahero-config
            - secretRef:
                name: afyahero-secrets

          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: NODE_ENV
              value: "production"
            - name: AFYAHERO_APP_MODE
              value: "superadmin"
            - name: NEXT_PUBLIC_APP_URL
              valueFrom:
                configMapKeyRef:
                  name: afyahero-config
                  key: SUPERADMIN_PUBLIC_APP_URL

          resources:
            requests:
              cpu: "300m"
              memory: "768Mi"
            limits:
              cpu: "1500m"
              memory: "1536Mi"

          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3

          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 2

          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true

          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: nextjs-cache
              mountPath: /app/.next/cache

      volumes:
        - name: tmp
          emptyDir: {}
        - name: nextjs-cache
          emptyDir: {}

      imagePullSecrets:
        - name: regcred

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: afyahero-celery
  namespace: afyahero
  labels:
    app: afyahero
    component: worker
    version: v1
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: afyahero
      component: worker
  template:
    metadata:
      labels:
        app: afyahero
        component: worker
        version: v1
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
      
      serviceAccountName: afyahero
      
      containers:
        - name: celery
          image: afyahero.azurecr.io/gateway:latest
          imagePullPolicy: IfNotPresent
          command: ["celery", "-A", "app.workers.celery_app", "worker", "--loglevel=info"]
          
          envFrom:
            - configMapRef:
                name: afyahero-config
            - secretRef:
                name: afyahero-secrets
          
          resources:
            requests:
              cpu: "500m"
              memory: "2Gi"
            limits:
              cpu: "2000m"
              memory: "2Gi"
