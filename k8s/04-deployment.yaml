              mountPath: /tmp
            - name: nextjs-cache
              mountPath: /app/.next/cache
      
      volumes:
        - name: tmp
          emptyDir: {}
        - name: nextjs-cache
          emptyDir: {}
      
      imagePullSecrets:
        - name: regcred

