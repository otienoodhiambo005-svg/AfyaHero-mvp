# ─── External Secrets Operator Configuration ────────────────────────────────────
# This file configures the External Secrets Operator to sync secrets from
# Azure Key Vault (or AWS Secrets Manager) to Kubernetes secrets.
#
# Prerequisites:
# 1. Install External Secrets Operator:
#    helm repo add external-secrets https://charts.external-secrets.io
#    helm install external-secrets external-secrets/external-secrets \
#      -n external-secrets --create-namespace
#
# 2. For Azure Key Vault:
#    - Create a managed identity for the cluster
#    - Grant the identity access to the Key Vault
#    - Create the Key Vault with secrets
#
# 3. For AWS Secrets Manager:
#    - Create an IAM role with access to Secrets Manager
#    - Configure IRSA (IAM Roles for Service Accounts)

---
# ClusterSecretStore for Azure Key Vault
apiVersion: external-secrets.io/v1beta1
kind: ClusterSecretStore
metadata:
  name: azure-keyvault
  labels:
    app: afyahero
    component: external-secrets
spec:
  provider:
    azurekv:
      authType: ManagedIdentity
      vaultUrl: "https://afyahero-kv.vault.azure.net"
      # If using a specific tenant ID:
      # tenantId: "your-tenant-id"

---
# Alternative: ClusterSecretStore for AWS Secrets Manager
# Uncomment and configure if using AWS instead of Azure
# apiVersion: external-secrets.io/v1beta1
# kind: ClusterSecretStore
# metadata:
#   name: aws-secretsmanager
#   labels:
#     app: afyahero
#     component: external-secrets
# spec:
#   provider:
#     aws:
#       service: SecretsManager
#       region: us-east-1
#       auth:
#         jwt:
#           serviceAccountRef:
#             name: external-secrets-sa
#             namespace: external-secrets

---
# ExternalSecret for AfyaHero application secrets
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: afyahero-secrets
  namespace: afyahero
  labels:
    app: afyahero
    component: external-secrets
spec:
  refreshInterval: 1h  # Check for secret updates every hour
  secretStoreRef:
    name: azure-keyvault
    kind: ClusterSecretStore
  target:
    name: afyahero-secrets
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      type: Opaque
      metadata:
        labels:
          app: afyahero
  data:
    # Database credentials
    - secretKey: DATABASE_URL
      remoteRef:
        key: afyahero/database
        property: connection-string
    
    - secretKey: DATABASE_PASSWORD
      remoteRef:
        key: afyahero/database
        property: password
    
    # Supabase credentials
    - secretKey: SUPABASE_URL
      remoteRef:
        key: afyahero/supabase
        property: url
    
    - secretKey: SUPABASE_KEY
      remoteRef:
        key: afyahero/supabase
        property: anon-key
    
    - secretKey: SUPABASE_SERVICE_ROLE_KEY
      remoteRef:
        key: afyahero/supabase
        property: service-role-key
    
    - secretKey: SUPABASE_JWT_SECRET
      remoteRef:
        key: afyahero/supabase
        property: jwt-secret
    
    # Redis credentials
    - secretKey: UPSTASH_REDIS_REST_URL
      remoteRef:
        key: afyahero/redis
        property: url
    
    - secretKey: UPSTASH_REDIS_REST_TOKEN
      remoteRef:
        key: afyahero/redis
        property: token
    
    # Session secrets
    - secretKey: SESSION_SECRET
      remoteRef:
        key: afyahero/session
        property: secret
    
    # Email service credentials
    - secretKey: EMAIL_SMTP_PASS
      remoteRef:
        key: afyahero/email
        property: smtp-password
    
    # AI Provider API Keys
    - secretKey: OPENAI_API_KEY
      remoteRef:
        key: afyahero/ai-providers
        property: openai-api-key
    
    - secretKey: ANTHROPIC_API_KEY
      remoteRef:
        key: afyahero/ai-providers
        property: anthropic-api-key
    
    - secretKey: GEMINI_API_KEY
      remoteRef:
        key: afyahero/ai-providers
        property: gemini-api-key
    
    - secretKey: GROQ_API_KEY
      remoteRef:
        key: afyahero/ai-providers
        property: groq-api-key
    
    - secretKey: HF_API_KEY
      remoteRef:
        key: afyahero/ai-providers
        property: huggingface-api-key
    
    # AfyaLink integration credentials
    - secretKey: AFYALINK_BASIC_USERNAME
      remoteRef:
        key: afyahero/afyalink
        property: basic-username
    
    - secretKey: AFYALINK_BASIC_PASSWORD
      remoteRef:
        key: afyahero/afyalink
        property: basic-password
    
    - secretKey: AFYALINK_TOKEN_SECRET
      remoteRef:
        key: afyahero/afyalink
        property: token-secret
    
    - secretKey: AFYALINK_PRIVATE_KEY
      remoteRef:
        key: afyahero/afyalink
        property: private-key

---
# ExternalSecret for monitoring secrets
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: monitoring-secrets
  namespace: afyahero
  labels:
    app: afyahero
    component: external-secrets
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: azure-keyvault
    kind: ClusterSecretStore
  target:
    name: monitoring-secrets
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      type: Opaque
  data:
    # Sentry error tracking
    - secretKey: SENTRY_DSN
      remoteRef:
        key: afyahero/monitoring
        property: sentry-dsn
    
    # Datadog monitoring
    - secretKey: DATADOG_API_KEY
      remoteRef:
        key: afyahero/monitoring
        property: datadog-api-key

---
# ServiceAccount for External Secrets Operator (if using workload identity)
apiVersion: v1
kind: ServiceAccount
metadata:
  name: external-secrets-sa
  namespace: afyahero
  labels:
    app: afyahero
    component: external-secrets
  annotations:
    # For Azure Workload Identity:
    azure.workload.identity/client-id: "your-managed-identity-client-id"
    # For AWS IRSA:
    # eks.amazonaws.com/role-arn: "arn:aws:iam::123456789012:role/external-secrets-role"

---
# ClusterSecretStore using the service account (namespace-scoped)
apiVersion: external-secrets.io/v1beta1
kind: SecretStore
metadata:
  name: afyahero-secret-store
  namespace: afyahero
  labels:
    app: afyahero
    component: external-secrets
spec:
  provider:
    azurekv:
      authType: WorkloadIdentity
      vaultUrl: "https://afyahero-kv.vault.azure.net"
      serviceAccountRef:
        name: external-secrets-sa