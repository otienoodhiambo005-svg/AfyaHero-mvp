# Google Cloud Build Configuration for AfyaHero
steps:
  # 1. Install dependencies
  - name: 'node:20'
    entrypoint: npm
    args: ['ci']
    dir: 'pulse-core-nextjs'

  # 2. Run type checking
  - name: 'node:20'
    entrypoint: npm
    args: ['run', 'typecheck']
    dir: 'pulse-core-nextjs'

  # 3. Run linting
  - name: 'node:20'
    entrypoint: npm
    args: ['run', 'lint']
    dir: 'pulse-core-nextjs'

  # 4. Run tests
  - name: 'node:20'
    entrypoint: npm
    args: ['run', 'test']
    dir: 'pulse-core-nextjs'
    env:
      - 'NODE_ENV=test'

  # 5. Build the application
  - name: 'node:20'
    entrypoint: npm
    args: ['run', 'build']
    dir: 'pulse-core-nextjs'
    env:
      - 'NODE_ENV=production'

  # 6. Build Docker image
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', 'gcr.io/afyahero/afyahero:$COMMIT_SHA', '.']
    dir: 'pulse-core-nextjs'

  # 7. Push Docker image to Container Registry
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/afyahero/afyahero:$COMMIT_SHA']

  # 8. Deploy to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
    - 'run'
    - 'deploy'
    - 'afyahero-api'
    - '--image=gcr.io/afyahero/afyahero:$COMMIT_SHA'
    - '--region=africa-south1'
    - '--platform=managed'
    - '--allow-unauthenticated'

images:
  - 'gcr.io/afyahero/afyahero:$COMMIT_SHA'

options:
  logging: CLOUD_LOGGING_ONLY
  machineType: 'E2_HIGHCPU_8'

timeout: '1200s'

substitutions:
  _SERVICE_NAME: afyahero-api
  _REGION: africa-south1