version: '3.9'

services:
  web:
    container_name: afyahero-web
    build:
      context: .
      dockerfile: Dockerfile
    image: afyahero-web:latest
    restart: unless-stopped
    env_file:
      - .env.local
    environment:
      NODE_ENV: production
      PORT: 3003
      HOSTNAME: 0.0.0.0
    ports:
      - "3003:3003"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:3003/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
