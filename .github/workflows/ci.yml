name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Typecheck, lint, unit tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pulse-core-nextjs
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: pulse-core-nextjs/package-lock.json

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Validate Prisma schema
        run: npx prisma validate

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Jest unit tests
        run: npm test -- --ci

  e2e-smoke:
    name: Playwright auth matrix smoke
    runs-on: ubuntu-latest
    needs: quality
    defaults:
      run:
        working-directory: pulse-core-nextjs
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: pulse-core-nextjs/package-lock.json

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Install Playwright browsers
        run: npx playwright install chromium --with-deps

      - name: Auth matrix E2E (Chromium)
        run: npx playwright test tests/e2e/api/auth-matrix.spec.ts tests/portal-auth-matrix.spec.ts --project=chromium
        env:
          CI: 'true'
          ENABLE_DEMO_LOGIN: '1'
          USSD_WEBHOOK_SECRET: test-ussd-webhook-secret
          WHATSAPP_WEBHOOK_SECRET: test-whatsapp-webhook-secret
          SESSION_SECRET: ci-session-secret-minimum-32-characters-long
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key
