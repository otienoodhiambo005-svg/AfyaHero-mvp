services:
  # ─── PostgreSQL Database ─────────────────────────────────────────────────────
  db:
    image: postgres:15-alpine
    container_name: afyahero-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: afyahero
      POSTGRES_PASSWORD: ${DB_PASSWORD:-afyahero_dev}
      POSTGRES_DB: afyahero
      POSTGRES_MAX_CONNECTIONS: 200
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U afyahero"]
      interval: 10s
      timeout: 5s
      retries: 5
    ports:
      - "5432:5432"
    networks:
      - afyahero-net

  # ─── Redis (Caching & Rate Limiting) ─────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: afyahero-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    ports:
      - "6379:6379"
    networks:
      - afyahero-net

  # ─── FastAPI Gateway (Python) ────────────────────────────────────────────────
  gateway:
    container_name: afyahero-gateway
    build:
      context: ./gateway
      dockerfile: Dockerfile
    image: afyahero-gateway:latest
    restart: unless-stopped
    env_file:
      - ./gateway/.env
    environment:
      - ENVIRONMENT=production
      - DATABASE_URL=postgresql+asyncpg://afyahero:${DB_PASSWORD:-afyahero_dev}@db:5432/afyahero
      - REDIS_URL=redis://redis:6379
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx; httpx.get('http://127.0.0.1:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - afyahero-net

  # ─── Next.js Frontend ─────────────────────────────────────────────────────────
  web:
    container_name: afyahero-web
    build:
      context: ./pulse-core-nextjs
      dockerfile: Dockerfile
    image: afyahero-web:latest
    restart: unless-stopped
    env_file:
      - ./pulse-core-nextjs/.env.local
    environment:
      - NODE_ENV=production
      - PORT=3003
      - HOSTNAME=0.0.0.0
      - NEXT_PUBLIC_SUPABASE_URL=${NEXT_PUBLIC_SUPABASE_URL}
      - NEXT_PUBLIC_SUPABASE_ANON_KEY=${NEXT_PUBLIC_SUPABASE_ANON_KEY}
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY}
      - SESSION_SECRET=${SESSION_SECRET}
    ports:
      - "3003:3003"
    depends_on:
      gateway:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:3003/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks:
      - afyahero-net

  # ─── Standalone Super Admin Portal (Optional profile) ─────────────────────
  superadmin-web:
    container_name: afyahero-superadmin-web
    profiles: ["superadmin"]
    build:
      context: ./pulse-core-nextjs
      dockerfile: Dockerfile
    image: afyahero-superadmin-web:latest
    restart: unless-stopped
    env_file:
      - ./pulse-core-nextjs/.env.local
    environment:
      - NODE_ENV=production
      - PORT=3004
      - HOSTNAME=0.0.0.0
      - AFYAHERO_APP_MODE=superadmin
      - NEXT_PUBLIC_APP_URL=${SUPERADMIN_PUBLIC_APP_URL:-https://superadmin.afyahero.com}
      - NEXT_PUBLIC_SUPABASE_URL=${NEXT_PUBLIC_SUPABASE_URL}
      - NEXT_PUBLIC_SUPABASE_ANON_KEY=${NEXT_PUBLIC_SUPABASE_ANON_KEY}
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY}
      - SESSION_SECRET=${SESSION_SECRET}
    ports:
      - "3004:3004"
    depends_on:
      gateway:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:3004/api/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks:
      - afyahero-net

  # ─── Celery Worker (Background Jobs) ─────────────────────────────────────────
  celery-worker:
    container_name: afyahero-celery
    build:
      context: ./gateway
      dockerfile: Dockerfile
    image: afyahero-gateway:latest
    restart: unless-stopped
    command: celery -A app.workers.celery_app worker --loglevel=info --concurrency=2
    env_file:
      - ./gateway/.env
    environment:
      - ENVIRONMENT=production
      - DATABASE_URL=postgresql+asyncpg://afyahero:${DB_PASSWORD:-afyahero_dev}@db:5432/afyahero
      - REDIS_URL=redis://redis:6379
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      gateway:
        condition: service_healthy
    networks:
      - afyahero-net

  # ─── Nginx Reverse Proxy (Production) ───────────────────────────────────────
  nginx:
    image: nginx:alpine
    container_name: afyahero-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      - web
      - gateway
    networks:
      - afyahero-net

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

networks:
  afyahero-net:
    driver: bridge
